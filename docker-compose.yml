services:
  db:
    image: postgres:16-alpine
    container_name: workflow-map-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wfmap
      POSTGRES_PASSWORD: wfmap_dev_pw
      POSTGRES_DB: workflow_map
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfmap -d workflow_map"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workflow-map-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://wfmap:wfmap_dev_pw@db:5432/workflow_map
      DATABASE_SYNC_URL: postgresql+psycopg2://wfmap:wfmap_dev_pw@db:5432/workflow_map
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - git_workspace:/app/git-workspace
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://34.173.140.181:8000
    container_name: workflow-map-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  git_workspace:
